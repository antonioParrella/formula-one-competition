# F1 Tipping Optimiser configuration.
# Everything random is seeded from here; change `seed` for a different sim set.

race:
  # Update these before each fetch — used to find the Betfair event and to
  # name snapshot files. Round drives the underdog rule (no bonus in round 1).
  name: "Belgian Grand Prix"    # must match the Betfair event text (e.g. "F1 Belgian Grand Prix")
  year: 2026
  round: 10                     # comp round (Spa, race 2026-07-19)
  include_sprint_markets: false   # sprint weekends list separate markets — keep GP only

betfair:
  credentials_path: "~/.betfair/credentials.yaml"   # username, password, app_key, certs_path
  event_type_id: "8"                                # Motor Sport (Betfair canonical id)
  # Market name fragments searched in listMarketCatalogue output, priority order.
  market_names:
    win:   ["Race Winner", "Winner"]
    top10: ["Points Finish", "Top 10 Finish", "Top 10"]
    top6:  ["Top 6 Finish", "Top 6"]
    top3:  ["Podium Finish", "Top 3 Finish", "Top 3", "Podium"]
    # Driver-runner markets "Yes To be Classified" / "No To be Classified" —
    # per driver, de-vigged to P(classified); 1 - P(classified) is the
    # driver's DNF probability.
    classified: ["To Be Classified", "Classified"]
  fetch_h2h: true                                   # markets with ' v ' in the name

sources:
  # Sources pulled by `fetch --source all`. Each failing source is skipped
  # with a warning; if >= 2 succeed a combined snapshot is also saved (and,
  # being newest, is what `fit` picks up).
  enabled: [betfair, kalshi, polymarket]

kalshi:
  # Public REST market data — no account or auth (auth is trading-only).
  # Race events open ~2 weeks before the race; earlier fetches fail loudly.
  api_base: "https://api.elections.kalshi.com/trade-api/v2"
  # Series ticker per structural market. Event tickers are
  # <series>-<race suffix> (e.g. KXF1RACE-BRIGP26); the suffix is
  # discovered from the win series by race name.
  series:
    win:   KXF1RACE
    top3:  KXF1RACEPODIUM
    top5:  KXF1TOP5
    top10: KXF1TOP10
  max_spread: 0.15    # drop two-sided quotes wider than this (prob space)

polymarket:
  # Public Gamma API — no account or auth. Winner books go live weeks out;
  # podium/h2h sit on placeholder quotes (dropped by max_spread) until
  # close to the weekend.
  api_base: "https://gamma-api.polymarket.com"
  tag_slug: f1
  # Event title fragments per market key, matched together with race.name
  # (e.g. "Belgian Grand Prix: Driver Winner").
  market_titles:
    win:  ["driver winner"]
    top3: ["podium"]
    h2h:  ["head-to-head"]
  max_spread: 0.15

devig:
  win_method: proportional      # proportional | power
  # Top-N markets sum to N. Power keeps near-certain favourites pinned and
  # removes the vig from the longshots, where it actually sits; proportional
  # drags favourites below their win/top-6 prices.
  topn_method: power            # power | proportional

model:
  # Race-model family (DISPERSION.md):
  #   gumbel   - Plackett-Luce, one strength θ per driver (MATH.md)
  #   gaussian - Thurstonian: each driver gets a center μ AND a spread σ,
  #              fixing the rank-1 incoherence (can't match win/top-3/6/10
  #              with one parameter). See DISPERSION.md and COMPARISON.md.
  dist: gaussian
  n_sims: 100000                # Monte Carlo races for optimisation/validation
  fit_sims: 4000                # fixed draws used inside the fitting objective
  fit_tau: 0.15                 # soft-rank temperature for the differentiable fit
  seed: 20260703
  dnf:
    # Per driver, highest priority first: per_driver override here ->
    # market-implied 1 - P(classified) from the "To Be Classified" Yes/No
    # markets -> default_prob season prior.
    default_prob: 0.10          # season-average retirement prior (fallback)
    per_driver: {}              # explicit override, e.g. { STR: 0.18, GAS: 0.14 }

bayes:
  # Bayesian path (`fit --bayes`, MATH.md Section 7): de-vigged market
  # probs become logit-scale observations of latent theta; the posterior
  # is sampled and validate/optimise consume posterior-predictive races.
  method: mcmc            # mcmc (robust, ~10-20 min) | is (fast, ~2-4 min, k-hat guarded)
  fit_sims: 1000          # CRN draws behind the surrogate likelihood (cheaper than model.fit_sims)
  tau: 0.15               # soft-rank temperature (match model.fit_tau)
  batch: 16               # states per batched surrogate evaluation (memory bound)
  tau_prior: 2.0          # N(0, tau_prior^2) prior on raw theta (gauge + longshot containment)
  # Observation scale for the likelihood. probability (default) matches the
  # point fit's objective and the validation metric; logit was measured to
  # let pinned longshot prices dominate and inflate sigma_obs.
  obs_scale: probability  # probability | logit
  sigma_scale: 0.05       # HalfNormal prior scale for sigma_obs, in obs units
                          # (0.05 = 5pp on the probability scale; ~0.5 for logit)
  dnf_prior_sd: 0.7       # logit-normal sd around dnf.default_prob for sampled DNF params
  seed: 20260703          # CRN draws = seed; walker init = +1; chain/proposal = +2; SIR = +3
  # mcmc engine
  walkers: 64             # auto-raised to 2*D (even)
  steps: 1200
  burn_in: 400
  thin: 50                # retained draws S = walkers * floor((steps - burn_in)/thin)
  # is engine
  is_draws: 8000          # proposal draws
  is_nu: 7                # Student-t degrees of freedom (heavy tails for finite-variance weights)
  is_scale: 1.3           # proposal covariance inflation over the Laplace H^-1
  resample_draws: 1024    # unweighted draws after SIR
  # validation credible intervals
  ci: 0.90
  ci_draws: 200           # posterior draws behind the CI columns
  ci_sims_per_draw: 4000

underdogs:
  # Championship top-10 before the race: picks OUTSIDE this set score double
  # (Scorer.MULTIPLIER_UNDERDOG) from round 2 onwards.
  source: openf1                # openf1 | manual
  # Fallback / manual list. Snapshot is standings AFTER round 9 (Silverstone),
  # i.e. entering round 10 (Spa) — refresh before relying on it.
  manual_top10: [ANT, RUS, HAM, LEC, NOR, PIA, VER, HAD, GAS, LAW]

optimise:
  n_restarts: 20
  max_iters: 200                # hill-climb steps per restart
  n_runner_ups: 5
  # Current comp scoring is additive per pick, so candidate EVs come from the
  # per-(driver, slot) expected-points matrix (exact, fast). Set false if
  # scoring/rules.py is rewritten with cross-pick interactions.
  assume_additive: true

drivers:
  # Runner name -> 3-letter code, used by every odds source (the key name
  # is historical). Codes must exist in src/race_utils.DRIVER_MAP (single
  # source of truth). Runners not matched here fall back to a surname match
  # against DRIVER_MAP, else are skipped with a warning.
  betfair_names:
    "Max Verstappen": VER
    "Lando Norris": NOR
    "Oscar Piastri": PIA
    "Charles Leclerc": LEC
    "Lewis Hamilton": HAM
    "George Russell": RUS
    "Kimi Antonelli": ANT
    "Andrea Kimi Antonelli": ANT
    "Isack Hadjar": HAD
    "Carlos Sainz": SAI
    "Carlos Sainz Jr.": SAI
    "Fernando Alonso": ALO
    "Alexander Albon": ALB
    "Alex Albon": ALB
    "Pierre Gasly": GAS
    "Esteban Ocon": OCO
    "Lance Stroll": STR
    "Nico Hulkenberg": HUL
    "Yuki Tsunoda": TSU
    "Liam Lawson": LAW
    "Oliver Bearman": BEA
    "Gabriel Bortoleto": BOR
    "Arvid Lindblad": LIN
    "Jack Doohan": DOO
    "Franco Colapinto": COL
    "Valtteri Bottas": BOT
    "Sergio Perez": PER
